[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "local-firmware",
    "can-display",
    "tools/re/F2MC-16LX",
]

[tool.ruff.lint]
# Держим набор узким: реверс-инжиниринговые скрипты написаны в разных стилях
# (в т.ч. однобуквенные имена для адресов/байт), ловим только реальные баги.
select = ["E", "F", "W"]
ignore = [
    "E501",  # длина строки — не критично для скриптов с таблицами опкодов
]

[tool.pytest.ini_options]
testpaths = ["tests"]
