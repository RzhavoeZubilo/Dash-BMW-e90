<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMW E90 DKOML2 - Virtual Cluster UI Simulator</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @font-face {
      font-family: 'BMW-Matrix';
      src: local('Courier New'), monospace;
    }
    .bmw-amber-glow {
      text-shadow: 0 0 8px rgba(255, 110, 0, 0.75), 0 0 16px rgba(255, 60, 0, 0.4);
    }
    .bmw-amber-box {
      box-shadow: 0 0 12px rgba(255, 110, 0, 0.4), inset 0 0 8px rgba(255, 80, 0, 0.2);
    }
    .lcd-bg {
      background: radial-gradient(circle at center, #2b1100 0%, #150800 100%);
      border: 2px solid #3d1b05;
    }
    .lcd-grid {
      background-image: 
        linear-gradient(rgba(255, 110, 0, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 110, 0, 0.04) 1px, transparent 1px);
      background-size: 4px 4px;
    }
    .trapezoid-top {
      clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%);
    }
    .trapezoid-bottom {
      clip-path: polygon(6% 0%, 94% 0%, 100% 100%, 0% 100%);
    }
    @keyframes strobe {
      0%, 49% { opacity: 1; filter: drop-shadow(0 0 14px #ff3b00); }
      50%, 100% { opacity: 0.15; filter: none; }
    }
    .strobe-active {
      animation: strobe 0.12s infinite;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 flex flex-col items-center justify-center font-sans antialiased select-none">

  <!-- Header -->
  <div class="max-w-2xl w-full mb-4 text-center">
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-orange-950/60 border border-orange-800/40 text-orange-400 text-xs font-medium mb-1">
      <span class="w-2 h-2 rounded-full bg-orange-500 animate-pulse"></span>
      BMW E90 DKOML2 Custom Firmware UI Simulator
    </div>
    <h1 class="text-xl font-bold tracking-tight text-white">Интерактивный эмулятор центрального дисплея</h1>
    <p class="text-xs text-slate-400">Визуализация прогрессивного Shift-Light на лампах ACC и кастомных режимов D1..D8</p>
  </div>

  <div class="max-w-4xl w-full grid grid-cols-1 md:grid-cols-12 gap-6 items-start">

    <!-- Cluster Central Display Unit (Left/Center Column) -->
    <div class="md:col-span-7 flex flex-col items-center">
      
      <!-- Cluster Shell Bezel -->
      <div class="w-72 bg-gradient-to-b from-stone-900 via-neutral-900 to-black p-4 rounded-3xl border-4 border-stone-800 shadow-2xl shadow-orange-950/20 relative flex flex-col items-center">
        
        <!-- Dial Rim Simulation (Left Speedo / Right Tach) -->
        <div class="absolute -left-12 top-16 w-16 h-48 rounded-full border-r-4 border-orange-600/30 opacity-40 pointer-events-none"></div>
        <div class="absolute -right-12 top-16 w-16 h-48 rounded-full border-l-4 border-orange-600/30 opacity-40 pointer-events-none"></div>

        <!-- ================= ACC SECTION (TOP) ================= -->
        <div id="accContainer" class="w-36 h-28 flex flex-col items-center justify-end relative pb-1 transition-all duration-75">
          
          <!-- Car Silhouette (Amber / Yellow) -->
          <div id="accCar" class="transition-all duration-100 opacity-20 mb-1">
            <svg class="w-12 h-9 text-amber-400 fill-current drop-shadow-[0_0_8px_rgba(251,191,36,0.6)]" viewBox="0 0 64 48">
              <!-- BMW Sedan rear view -->
              <path d="M 18 12 Q 32 8 46 12 L 52 22 L 58 26 L 56 36 L 52 38 L 50 34 L 14 34 L 12 38 L 8 36 L 6 26 L 12 22 Z" />
              <!-- Rear windshield -->
              <path d="M 20 14 Q 32 11 44 14 L 48 21 L 16 21 Z" fill="#180b00" />
              <!-- Taillights L/R -->
              <path d="M 8 28 L 16 28 L 15 32 L 8 31 Z" fill="#ff2200" />
              <path d="M 56 28 L 48 28 L 49 32 L 56 31 Z" fill="#ff2200" />
              <!-- Trunk line & Plate -->
              <rect x="25" y="27" width="14" height="4" rx="1" fill="#180b00" />
            </svg>
          </div>

          <!-- Road Corridor + 4 Distance Bars SVG -->
          <svg class="w-32 h-14" viewBox="0 0 120 60">
            <!-- Perspective Road Rails (Left & Right) -->
            <line x1="20" y1="56" x2="48" y2="6" stroke="#ff6a00" stroke-width="4" stroke-linecap="round" opacity="0.35" id="accRailL" />
            <line x1="100" y1="56" x2="72" y2="6" stroke="#ff6a00" stroke-width="4" stroke-linecap="round" opacity="0.35" id="accRailR" />

            <!-- Bar 4 (Top - narrowest, closest to car) -->
            <line id="bar4" x1="45" y1="12" x2="75" y2="12" stroke="#ff5500" stroke-width="4" stroke-linecap="round" opacity="0.15" />
            
            <!-- Bar 3 -->
            <line id="bar3" x1="40" y1="24" x2="80" y2="24" stroke="#ff5500" stroke-width="4.5" stroke-linecap="round" opacity="0.15" />
            
            <!-- Bar 2 -->
            <line id="bar2" x1="34" y1="38" x2="86" y2="38" stroke="#ff6600" stroke-width="5" stroke-linecap="round" opacity="0.15" />
            
            <!-- Bar 1 (Bottom - widest, closest to driver) -->
            <line id="bar1" x1="27" y1="52" x2="93" y2="52" stroke="#ff7700" stroke-width="5.5" stroke-linecap="round" opacity="0.15" />
          </svg>
        </div>

        <!-- ================= UPPER LCD (CLOCK / TEMP / TELEMETRY) ================= -->
        <div class="w-56 h-14 lcd-bg lcd-grid rounded-md mb-2 flex flex-col items-center justify-center border border-orange-950/80 shadow-inner px-3 py-1 relative">
          <!-- Page content rendered dynamically -->
          <div id="upperLcdContent" class="w-full flex flex-col items-center justify-center font-mono font-bold text-orange-500 bmw-amber-glow tracking-widest text-sm leading-tight">
            <span id="upperLine1">12:02</span>
            <span id="upperLine2">-20.0 °C</span>
          </div>
          <!-- Tiny Mode Indicator Tag -->
          <div id="upperModeBadge" class="absolute top-1 right-2 text-[9px] text-orange-700 font-mono tracking-normal">OEM</div>
        </div>

        <!-- ================= LOWER LCD (GEAR & BC / ODO) ================= -->
        <div class="w-60 h-28 lcd-bg lcd-grid rounded-md flex flex-col items-center justify-between border border-orange-950/80 shadow-inner p-2 relative">
          
          <!-- Central Gear Display with DKG Frame -->
          <div class="flex-1 flex items-center justify-center mt-1">
            <div id="gearBox" class="border-2 border-orange-500 bmw-amber-box px-3 py-0.5 rounded-sm flex items-center justify-center bg-orange-950/30">
              <span id="gearText" class="font-mono text-3xl font-black text-orange-400 bmw-amber-glow tracking-tighter">D</span>
            </div>
          </div>

          <!-- Bottom BC / Odometer Line -->
          <div class="w-full flex justify-between items-center text-[11px] font-mono font-bold text-orange-500/90 bmw-amber-glow pt-1 border-t border-orange-900/40">
            <span class="flex items-center gap-1">
              <span class="text-[9px] text-orange-600">km</span>
              <span>211652</span>
            </span>
            <span id="bcSubValue" class="text-right">035.9</span>
          </div>

        </div>

      </div>

      <!-- Realtime Status Banner -->
      <div class="mt-3 text-xs font-mono text-slate-400 flex items-center gap-4 bg-slate-900 px-4 py-2 rounded-xl border border-slate-800">
        <div>RPM: <span id="statRpm" class="text-orange-400 font-bold">0</span></div>
        <div>РЕЖИМ: <span id="statMode" class="text-white font-bold">D</span></div>
        <div>ACC: <span id="statAcc" class="text-amber-400 font-bold">ВЫКЛ</span></div>
      </div>

    </div>

    <!-- Controls Column (Right) -->
    <div class="md:col-span-5 bg-slate-900 border border-slate-800 p-5 rounded-2xl flex flex-col gap-5">
      
      <div class="flex items-center justify-between border-b border-slate-800 pb-2">
        <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-300">Пульт управления стендом</h2>
        <button id="btnDemoSweep" class="text-xs bg-orange-600 hover:bg-orange-500 text-white font-medium px-2.5 py-1 rounded-lg transition-all flex items-center gap-1 shadow-md shadow-orange-950">
          <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <span id="btnDemoText">Авто-Разгон</span>
        </button>
      </div>

      <!-- 1. Tachometer RPM Control -->
      <div class="flex flex-col gap-2">
        <div class="flex justify-between items-center text-xs">
          <label for="rpmSlider" class="font-medium text-slate-300">Обороты двигателя (CAN 0x0AA):</label>
          <span id="rpmValueDisplay" class="font-mono text-orange-400 font-bold text-sm">800 RPM</span>
        </div>
        <input id="rpmSlider" type="range" min="0" max="7500" step="50" value="800" 
               class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-orange-500" />
        
        <!-- Quick RPM Buttons -->
        <div class="grid grid-cols-4 gap-1.5 pt-1 text-xs">
          <button class="rpm-preset bg-slate-800 hover:bg-slate-700 py-1 rounded text-slate-300" data-rpm="800">800 (ХХ)</button>
          <button class="rpm-preset bg-slate-800 hover:bg-slate-700 py-1 rounded text-slate-300" data-rpm="5100">5100 (1 ст)</button>
          <button class="rpm-preset bg-slate-800 hover:bg-slate-700 py-1 rounded text-slate-300" data-rpm="5600">5600 (2 ст)</button>
          <button class="rpm-preset bg-orange-950/80 hover:bg-orange-900 text-orange-400 font-bold py-1 rounded border border-orange-800/40" data-rpm="6300">6300 (Shift!)</button>
        </div>
      </div>

      <!-- 2. Gearbox Mode (CAN 0x1D2) -->
      <div class="flex flex-col gap-2">
        <label class="text-xs font-medium text-slate-300">Селектор АКПП:</label>
        <div class="grid grid-cols-5 gap-1.5">
          <button class="gear-btn bg-slate-800 hover:bg-slate-700 py-1.5 rounded font-bold text-xs" data-mode="P">P</button>
          <button class="gear-btn bg-slate-800 hover:bg-slate-700 py-1.5 rounded font-bold text-xs" data-mode="R">R</button>
          <button class="gear-btn bg-slate-800 hover:bg-slate-700 py-1.5 rounded font-bold text-xs" data-mode="N">N</button>
          <button class="gear-btn bg-orange-600 text-white py-1.5 rounded font-bold text-xs shadow" data-mode="D">D</button>
          <button class="gear-btn bg-slate-800 hover:bg-slate-700 py-1.5 rounded font-bold text-xs" data-mode="M">M</button>
        </div>
      </div>

      <!-- 3. Manual Gear Selection (1..8) -->
      <div id="manualGearsSection" class="flex flex-col gap-2 opacity-50 pointer-events-none transition-opacity">
        <label class="text-xs font-medium text-slate-300">Передача в ручном режиме (M):</label>
        <div class="grid grid-cols-8 gap-1">
          <button class="mgear-btn bg-slate-800 hover:bg-slate-700 py-1 rounded font-mono text-xs" data-gear="1">1</button>
          <button class="mgear-btn bg-slate-800 hover:bg-slate-700 py-1 rounded font-mono text-xs" data-gear="2">2</button>
          <button class="mgear-btn bg-slate-800 hover:bg-slate-700 py-1 rounded font-mono text-xs" data-gear="3">3</button>
          <button class="mgear-btn bg-slate-800 hover:bg-slate-700 py-1 rounded font-mono text-xs" data-gear="4">4</button>
          <button class="mgear-btn bg-slate-800 hover:bg-slate-700 py-1 rounded font-mono text-xs" data-gear="5">5</button>
          <button class="mgear-btn bg-slate-800 hover:bg-slate-700 py-1 rounded font-mono text-xs" data-gear="6">6</button>
          <button class="mgear-btn bg-slate-800 hover:bg-slate-700 py-1 rounded font-mono text-xs" data-gear="7">7</button>
          <button class="mgear-btn bg-orange-950 border border-orange-700 text-orange-400 font-bold py-1 rounded font-mono text-xs" data-gear="8">8</button>
        </div>
      </div>

      <!-- 4. Feature Switches -->
      <div class="flex flex-col gap-3 pt-2 border-t border-slate-800">
        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Кастомные функции прошивки:</label>
        
        <!-- Toggle D vs D1..D8 -->
        <label class="flex items-center justify-between p-2 rounded-lg bg-slate-950/60 border border-slate-800 cursor-pointer">
          <div class="flex flex-col">
            <span class="text-xs font-medium text-slate-200">Индикация D1..D8 в режиме Drive</span>
            <span class="text-[10px] text-slate-500">Вместо стандартного одиночного [D]</span>
          </div>
          <input id="toggleCustomDrive" type="checkbox" checked class="w-4 h-4 accent-orange-500 cursor-pointer rounded" />
        </label>

        <!-- Toggle Shift Light -->
        <label class="flex items-center justify-between p-2 rounded-lg bg-slate-950/60 border border-slate-800 cursor-pointer">
          <div class="flex flex-col">
            <span class="text-xs font-medium text-slate-200">Shift-Light на полосках ACC</span>
            <span class="text-[10px] text-slate-500">Ступени 5000, 5500, 6000 + стробоскоп 6200</span>
          </div>
          <input id="toggleShiftLight" type="checkbox" checked class="w-4 h-4 accent-orange-500 cursor-pointer rounded" />
        </label>

        <!-- Upper Screen Page Switcher -->
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-medium text-slate-300">Страница верхнего экрана (BC Toggle):</label>
          <div class="grid grid-cols-3 gap-1.5 text-xs">
            <button class="page-btn bg-orange-600 text-white font-medium py-1.5 rounded" data-page="0">Часы / T°</button>
            <button class="page-btn bg-slate-800 hover:bg-slate-700 text-slate-300 py-1.5 rounded" data-page="1">Масло / ОЖ</button>
            <button class="page-btn bg-slate-800 hover:bg-slate-700 text-slate-300 py-1.5 rounded" data-page="2">Вольт / Бар</button>
          </div>
        </div>

      </div>

    </div>

  </div>

  <!-- Interactive JavaScript Engine -->
  <script>
    // State
    const state = {
      rpm: 800,
      mode: 'D', // P, R, N, D, M
      manualGear: 1,
      actualDriveGear: 1,
      customDriveEnabled: true,
      shiftLightEnabled: true,
      upperPage: 0, // 0=OEM, 1=Temps, 2=Volt/Boost
      demoRunning: false,
      demoInterval: null
    };

    // DOM Elements
    const elRpmSlider = document.getElementById('rpmSlider');
    const elRpmValueDisplay = document.getElementById('rpmValueDisplay');
    const elStatRpm = document.getElementById('statRpm');
    const elStatMode = document.getElementById('statMode');
    const elStatAcc = document.getElementById('statAcc');
    const elGearText = document.getElementById('gearText');
    const elGearBox = document.getElementById('gearBox');
    const elManualSection = document.getElementById('manualGearsSection');
    const elToggleCustomDrive = document.getElementById('toggleCustomDrive');
    const elToggleShiftLight = document.getElementById('toggleShiftLight');
    const elUpperLine1 = document.getElementById('upperLine1');
    const elUpperLine2 = document.getElementById('upperLine2');
    const elUpperModeBadge = document.getElementById('upperModeBadge');
    const elBtnDemoSweep = document.getElementById('btnDemoSweep');
    const elBtnDemoText = document.getElementById('btnDemoText');

    // ACC SVG Elements
    const accCar = document.getElementById('accCar');
    const bar1 = document.getElementById('bar1');
    const bar2 = document.getElementById('bar2');
    const bar3 = document.getElementById('bar3');
    const bar4 = document.getElementById('bar4');
    const accRailL = document.getElementById('accRailL');
    const accRailR = document.getElementById('accRailR');
    const accContainer = document.getElementById('accContainer');

    function updateClusterUI() {
      // 1. RPM stats
      elRpmValueDisplay.textContent = `${state.rpm} RPM`;
      elStatRpm.textContent = state.rpm;

      // 2. Automatically compute drive gear based on RPM/Speed simulation
      if (state.mode === 'D') {
        if (state.rpm > 3500 && state.actualDriveGear < 8) state.actualDriveGear++;
        if (state.rpm < 1400 && state.actualDriveGear > 1) state.actualDriveGear--;
      }

      // 3. Lower Screen: Gear Display
      let gearString = state.mode;
      if (state.mode === 'D') {
        gearString = state.customDriveEnabled ? `D${state.actualDriveGear}` : 'D';
      } else if (state.mode === 'M') {
        gearString = `M${state.manualGear}`;
      }
      elGearText.textContent = gearString;
      elStatMode.textContent = gearString;

      // 4. Shift-Light on ACC Bars
      const isManual = (state.mode === 'M');
      let accActiveText = 'ВЫКЛ';

      // Reset strobe class
      accContainer.classList.remove('strobe-active');

      if (state.shiftLightEnabled && isManual) {
        if (state.rpm >= 6200) {
          // Strobe blink!
          accContainer.classList.add('strobe-active');
          accCar.style.opacity = '1';
          accRailL.style.opacity = '0.9';
          accRailR.style.opacity = '0.9';
          bar1.style.opacity = '1';
          bar2.style.opacity = '1';
          bar3.style.opacity = '1';
          bar4.style.opacity = '1';
          accActiveText = 'СТРОБОСКОП (6200+)';
        } else if (state.rpm >= 6000) {
          accCar.style.opacity = '0.9';
          accRailL.style.opacity = '0.8';
          accRailR.style.opacity = '0.8';
          bar1.style.opacity = '1';
          bar2.style.opacity = '1';
          bar3.style.opacity = '1';
          bar4.style.opacity = '0.15';
          accActiveText = '3 ПОЛОСКИ (6000)';
        } else if (state.rpm >= 5500) {
          accCar.style.opacity = '0.2';
          accRailL.style.opacity = '0.6';
          accRailR.style.opacity = '0.6';
          bar1.style.opacity = '1';
          bar2.style.opacity = '1';
          bar3.style.opacity = '0.15';
          bar4.style.opacity = '0.15';
          accActiveText = '2 ПОЛОСКИ (5500)';
        } else if (state.rpm >= 5000) {
          accCar.style.opacity = '0.2';
          accRailL.style.opacity = '0.4';
          accRailR.style.opacity = '0.4';
          bar1.style.opacity = '1';
          bar2.style.opacity = '0.15';
          bar3.style.opacity = '0.15';
          bar4.style.opacity = '0.15';
          accActiveText = '1 ПОЛОСКА (5000)';
        } else {
          // Off
          accCar.style.opacity = '0.15';
          accRailL.style.opacity = '0.25';
          accRailR.style.opacity = '0.25';
          bar1.style.opacity = '0.15';
          bar2.style.opacity = '0.15';
          bar3.style.opacity = '0.15';
          bar4.style.opacity = '0.15';
          accActiveText = 'ВЫКЛ (<5000)';
        }
      } else {
        // Shift light not active in non-M modes
        accCar.style.opacity = '0.15';
        accRailL.style.opacity = '0.25';
        accRailR.style.opacity = '0.25';
        bar1.style.opacity = '0.15';
        bar2.style.opacity = '0.15';
        bar3.style.opacity = '0.15';
        bar4.style.opacity = '0.15';
        accActiveText = isManual ? 'ОТКЛЮЧЕН' : 'АКТИВЕН В [M]';
      }
      elStatAcc.textContent = accActiveText;

      // 5. Upper LCD Pages
      if (state.upperPage === 0) {
        elUpperLine1.textContent = '12:02';
        elUpperLine2.textContent = '-20.0 °C';
        elUpperModeBadge.textContent = 'OEM';
      } else if (state.upperPage === 1) {
        // Dynamic simulated oil & coolant temps
        const oilT = 90 + Math.round(state.rpm / 500);
        const coolT = 88;
        elUpperLine1.textContent = `OIL  ${oilT} °C`;
        elUpperLine2.textContent = `COOL ${coolT} °C`;
        elUpperModeBadge.textContent = 'MOD:T°';
      } else if (state.upperPage === 2) {
        // Battery voltage & simulated boost
        const boostBar = (state.rpm > 2000) ? ((state.rpm - 2000) / 4000).toFixed(1) : '0.0';
        elUpperLine1.textContent = 'BAT  14.2 V';
        elUpperLine2.textContent = `BST  ${boostBar} bar`;
        elUpperModeBadge.textContent = 'MOD:TEL';
      }
    }

    // Event Listeners
    elRpmSlider.addEventListener('input', (e) => {
      state.rpm = parseInt(e.target.value, 10);
      updateClusterUI();
    });

    document.querySelectorAll('.rpm-preset').forEach(btn => {
      btn.addEventListener('click', () => {
        state.rpm = parseInt(btn.dataset.rpm, 10);
        elRpmSlider.value = state.rpm;
        updateClusterUI();
      });
    });

    // Gearbox Mode buttons
    document.querySelectorAll('.gear-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.gear-btn').forEach(b => {
          b.className = 'gear-btn bg-slate-800 hover:bg-slate-700 py-1.5 rounded font-bold text-xs';
        });
        btn.className = 'gear-btn bg-orange-600 text-white py-1.5 rounded font-bold text-xs shadow';
        state.mode = btn.dataset.mode;
        
        if (state.mode === 'M') {
          elManualSection.classList.remove('opacity-50', 'pointer-events-none');
        } else {
          elManualSection.classList.add('opacity-50', 'pointer-events-none');
        }
        updateClusterUI();
      });
    });

    // Manual Gear 1..8
    document.querySelectorAll('.mgear-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mgear-btn').forEach(b => b.classList.remove('bg-orange-600', 'text-white'));
        btn.classList.add('bg-orange-600', 'text-white');
        state.manualGear = parseInt(btn.dataset.gear, 10);
        updateClusterUI();
      });
    });

    elToggleCustomDrive.addEventListener('change', (e) => {
      state.customDriveEnabled = e.target.checked;
      updateClusterUI();
    });

    elToggleShiftLight.addEventListener('change', (e) => {
      state.shiftLightEnabled = e.target.checked;
      updateClusterUI();
    });

    // Page switcher
    document.querySelectorAll('.page-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.page-btn').forEach(b => {
          b.className = 'page-btn bg-slate-800 hover:bg-slate-700 text-slate-300 py-1.5 rounded';
        });
        btn.className = 'page-btn bg-orange-600 text-white font-medium py-1.5 rounded';
        state.upperPage = parseInt(btn.dataset.page, 10);
        updateClusterUI();
      });
    });

    // Demo acceleration loop
    elBtnDemoSweep.addEventListener('click', () => {
      state.demoRunning = !state.demoRunning;
      if (state.demoRunning) {
        elBtnDemoText.textContent = 'Стоп';
        elBtnDemoSweep.classList.replace('bg-orange-600', 'bg-red-600');
        
        // Auto drive in manual mode to show off shift light
        state.mode = 'M';
        state.manualGear = 2;
        state.rpm = 3000;
        
        state.demoInterval = setInterval(() => {
          state.rpm += 70;
          if (state.rpm >= 6700) {
            // Simulated gear shift!
            state.rpm = 4800;
            state.manualGear = (state.manualGear < 4) ? state.manualGear + 1 : 2;
          }
          elRpmSlider.value = state.rpm;
          updateClusterUI();
        }, 40);
      } else {
        elBtnDemoText.textContent = 'Авто-Разгон';
        elBtnDemoSweep.classList.replace('bg-red-600', 'bg-orange-600');
        clearInterval(state.demoInterval);
      }
    });

    // Initial render
    updateClusterUI();
  </script>
</body>
</html>
