<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 680" font-family="-apple-system,Segoe UI,Arial,sans-serif">
  <defs>
    <marker id="arrowData" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <marker id="arrowGnd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#44403c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="680" fill="#ffffff"/>

  <!-- title -->
  <text x="650" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Подключение USB-UART переходника к MB90F395HA (вход в Boot ROM)</text>

  <!-- legend -->
  <g font-size="13" fill="#374151">
    <line x1="330" y1="58" x2="366" y2="58" stroke="#c2410c" stroke-width="3"/>
    <text x="374" y="63">данные UART</text>
    <line x1="510" y1="58" x2="546" y2="58" stroke="#44403c" stroke-width="3"/>
    <text x="554" y="63">GND / режим (постоянно)</text>
    <line x1="760" y1="58" x2="796" y2="58" stroke="#44403c" stroke-width="3" stroke-dasharray="6,5"/>
    <text x="804" y="63">GND, кратковременно (сброс)</text>
  </g>

  <!-- ===================== USB-UART adapter box ===================== -->
  <g>
    <rect x="40" y="140" width="240" height="210" rx="14" fill="#f8fafc" stroke="#1f2937" stroke-width="2"/>
    <text x="160" y="166" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">USB-UART переходник</text>
    <text x="160" y="184" text-anchor="middle" font-size="12" fill="#6b7280">джампер уровня → 5V !</text>

    <circle cx="280" cy="220" r="5" fill="#c2410c"/>
    <text x="260" y="216" text-anchor="end" font-size="14" fill="#111827">TXD</text>

    <circle cx="280" cy="260" r="5" fill="#c2410c"/>
    <text x="260" y="256" text-anchor="end" font-size="14" fill="#111827">RXD</text>

    <circle cx="280" cy="300" r="5" fill="#44403c"/>
    <text x="260" y="296" text-anchor="end" font-size="14" fill="#111827">GND</text>

    <circle cx="90" cy="330" r="4" fill="#b91c1c"/>
    <text x="100" y="334" font-size="12" fill="#b91c1c" text-decoration="line-through">5V / VCC</text>
    <text x="160" y="340" text-anchor="middle" font-size="11" fill="#b91c1c" font-weight="700" dy="14">не подключать к плате!</text>
  </g>

  <!-- ===================== X11175 connector box ===================== -->
  <g>
    <rect x="40" y="420" width="240" height="150" rx="14" fill="#f8fafc" stroke="#1f2937" stroke-width="2"/>
    <text x="160" y="446" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Разъём X11175 приборки</text>

    <circle cx="280" cy="490" r="5" fill="#b91c1c"/>
    <text x="260" y="486" text-anchor="end" font-size="14" fill="#111827">Pin 9 · +12V</text>

    <circle cx="280" cy="530" r="5" fill="#44403c"/>
    <text x="260" y="526" text-anchor="end" font-size="14" fill="#111827">Pin 18 · GND</text>
  </g>
  <path d="M285,490 L 320,490" fill="none" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="6,5"/>
  <text x="326" y="494" font-size="12" fill="#b91c1c">питание платы — свой стабилизатор даёт чипу 5V, провод к чипу не тянуть</text>

  <!-- ===================== Chip outline ===================== -->
  <g>
    <rect x="820" y="115" width="300" height="475" fill="#111827" stroke="#111827"/>
    <text x="970" y="606" text-anchor="middle" font-size="13" fill="#374151">MB90F395HA, LQFP-120 (показаны только нужные выводы)</text>

    <!-- left-edge pins (short stub at the chip body itself) -->
    <line x1="780" y1="220" x2="820" y2="220" stroke="#9ca3af" stroke-width="3"/>
    <line x1="780" y1="260" x2="820" y2="260" stroke="#9ca3af" stroke-width="3"/>
    <line x1="780" y1="300" x2="820" y2="300" stroke="#9ca3af" stroke-width="3"/>

    <!-- right-edge pins -->
    <line x1="1120" y1="140" x2="1160" y2="140" stroke="#9ca3af" stroke-width="3"/>
    <text x="1166" y="136" font-size="14" font-weight="600" fill="#111827">Pin 87 · MD2</text>

    <line x1="1120" y1="180" x2="1160" y2="180" stroke="#4b5563" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="1166" y="184" font-size="12" fill="#6b7280">Pin 88 · MD1 (=1, на плате)</text>

    <line x1="1120" y1="210" x2="1160" y2="210" stroke="#4b5563" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="1166" y="214" font-size="12" fill="#6b7280">Pin 89 · MD0 (=1, на плате)</text>

    <line x1="1120" y1="500" x2="1160" y2="500" stroke="#9ca3af" stroke-width="3"/>
    <text x="1166" y="496" font-size="14" font-weight="600" fill="#111827">Pin 90 · RST</text>
  </g>

  <!-- ===================== data wires (straight, aligned rows) =====================
       Каждая линия разорвана в середине — там, где сидит подпись, чтобы стрелка
       не перекрывала текст (вместо наложения текста поверх линии z-order'ом). -->
  <path d="M280,220 L 440,220" fill="none" stroke="#c2410c" stroke-width="2.5"/>
  <path d="M660,220 L 780,220" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arrowData)"/>
  <text x="550" y="211" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Pin 7 · SIN0 (RX чипа)</text>

  <path d="M780,260 L 660,260" fill="none" stroke="#c2410c" stroke-width="2.5"/>
  <path d="M440,260 L 280,260" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arrowData)"/>
  <text x="550" y="251" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Pin 5 · SOT0 (TX чипа)</text>

  <path d="M280,300 L 440,300" fill="none" stroke="#44403c" stroke-width="2.5"/>
  <path d="M660,300 L 780,300" fill="none" stroke="#44403c" stroke-width="2.5" marker-end="url(#arrowGnd)"/>
  <text x="550" y="291" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Pin 16 · VSS (GND)</text>

  <!-- GND branch up-and-over to MD2 (enter Boot ROM) -->
  <path d="M700,300 L 700,95 L 1120,95 L 1120,140" fill="none" stroke="#44403c" stroke-width="2.5" marker-end="url(#arrowGnd)"/>
  <text x="900" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#44403c">GND → Pin 87 (MD2): вход в Boot ROM</text>

  <!-- X11175 GND under the bottom to RST (momentary) -->
  <path d="M280,530 L 300,530 L 300,650 L 1190,650 L 1190,500 L 1160,500" fill="none" stroke="#44403c" stroke-width="2.5" stroke-dasharray="6,5" marker-end="url(#arrowGnd)"/>
  <text x="745" y="665" text-anchor="middle" font-size="13" fill="#44403c">кратковременно → Pin 90 (RST): сброс, уже при заземлённом MD2</text>

</svg>
